[defaults]
    base_features = sparse_super,filetype,resize_inode,dir_index,ext_attr
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384

[fs_types]
    ext4 = {
        features = extent,uninit_bg,dir_nlink,extra_isize
        inode_size = 256
        lazy_itable_init = false
        options = nodiscard,lazy_itable_init=0
    }
    small = {
        inode_ratio = 16384
    }
